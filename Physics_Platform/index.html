<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Academy | أ. أسامة هديب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; 
            /* تدرج لوني مطابق لخلفية الصورة */
            background: linear-gradient(135deg, #434343 0%, #111111 100%); 
            margin: 0; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* خطوط هندسية صفراء مائلة في الخلفية */
        .bg-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                45deg, 
                transparent, 
                transparent 150px, 
                rgba(253, 197, 0, 0.05) 150px, 
                rgba(253, 197, 0, 0.05) 153px
            );
            z-index: -1;
        }

        header { 
            width: 100%; 
            text-align: center; 
            padding: 80px 0 30px 0; 
            animation: fadeInDown 1s ease-out forwards;
        }
        
        h1 { 
            margin: 0; 
            font-size: 3.5em; 
            font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* حاوية العنوان لترتيب الكلمات تحت بعضها ومحاذاتها لليمين */
        .title-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start; /* flex-start تعني المحاذاة لليمين لأن الصفحة RTL */
        }
        
        /* تنسيق كلمة Light Academy (أكبر وباللون الذهبي) */
        .light-text { 
            color: #fdc500; 
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive; 
            font-size: 1.8em; 
            font-weight: normal;
            line-height: 1.1;
            direction: ltr; /* الحفاظ على اتجاه الكلمة الإنجليزية */
        }
        
        /* تنسيق كلمة للفيزياء (أصغر، بيضاء، أسفل الكلمة الأولى ولليمين) */
        .physics-text { 
            color: #fff; 
            font-family: 'Cairo', sans-serif;
            font-size: 0.75em; 
            margin-top: -15px; /* رفع الكلمة قليلاً لتقترب من الكلمة الإنجليزية */
            margin-right: 15px; /* إزاحة لليمين لتتناسق مع ميلان الخط الإنجليزي */
        }
        
        p.subtitle { 
            margin: 35px 0 0 0; 
            font-size: 1.5em; 
            color: #ccc; 
            font-weight: 700;
        }

        .container { 
            display: flex; 
            gap: 30px; 
            margin-top: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 1200px; 
            padding: 20px; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 250px; 
            border-radius: 20px; 
            padding: 40px 30px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-decoration: none; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            
            opacity: 0;
            transform: translateY(50px);
        }

        .card:nth-child(1) { animation: fadeInUp 0.8s ease-out 0.2s forwards; }
        .card:nth-child(2) { animation: fadeInUp 0.8s ease-out 0.4s forwards; }
        .card:nth-child(3) { animation: fadeInUp 0.8s ease-out 0.6s forwards; }
        .card:nth-child(4) { animation: fadeInUp 0.8s ease-out 0.8s forwards; }

        .card:hover { 
            transform: translateY(-15px) scale(1.05); 
            box-shadow: 0 20px 40px rgba(253, 197, 0, 0.15); 
            border-color: #fdc500;
            background: rgba(255, 255, 255, 0.08);
        }

        .icon { 
            font-size: 4.5em; 
            margin-bottom: 20px; 
            transition: transform 0.4s;
        }
        .card:hover .icon { 
            transform: scale(1.2) rotate(10deg); 
        }
        
        .card h2 { 
            color: #fff; 
            margin-bottom: 25px; 
            font-size: 1.8em;
            font-weight: 900;
        }
        
        .btn { 
            background-color: #fdc500; 
            color: #111; 
            padding: 12px 30px; 
            border-radius: 30px; 
            font-weight: 900; 
            font-size: 1.2em;
            transition: all 0.3s; 
            width: 70%; 
            box-shadow: 0 4px 15px rgba(253, 197, 0, 0.3);
        }
        
        .card:hover .btn { 
            background-color: #fff; 
            color: #111;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }
        
        .disabled { opacity: 0.4; cursor: not-allowed; }
        .disabled:hover { 
            transform: translateY(0) scale(1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }
        .disabled:hover .icon { transform: none; }
        .disabled .btn { background-color: #444; color: #999; box-shadow: none;}
        .disabled:hover .btn { background-color: #444; }

        .teacher-badge {
            margin-top: 60px;
            margin-bottom: 30px;
            padding: 12px 40px;
            background: rgba(253, 197, 0, 0.1);
            border: 2px solid #fdc500;
            border-radius: 50px;
            color: #fdc500;
            font-size: 1.5em;
            font-weight: bold;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1.2s forwards;
            box-shadow: 0 0 20px rgba(253, 197, 0, 0.2);
            transition: all 0.3s;
        }
        
        .teacher-badge:hover {
            background: #fdc500;
            color: #111;
            transform: scale(1.05);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-lines"></div>
    
    <header>
        <h1>
            <div class="title-wrapper">
                <span class="light-text">Light Academy</span>
                <span class="physics-text">للفيزياء</span>
            </div>
        </h1>
        <p class="subtitle">طريقك نحو الإبداع</p>
    </header>
    
    <div class="container">
        <a href="grade9.html" class="card">
            <div class="icon">🏫</div><h2>التاسع</h2><div class="btn">دخول</div>
        </a>
        
        <a href="grade10.html" class="card">
            <div class="icon">🎓</div><h2>العاشر</h2><div class="btn">دخول</div>
        </a>
        
        <a href="#" class="card disabled" onclick="event.preventDefault();">
            <div class="icon">🔬</div><h2>الأول ثانوي</h2><div class="btn">قريباً</div>
        </a>
        
        <!-- تم فك القفل عن التوجيهي -->
        <a href="tawjihi.html" class="card">
            <div class="icon">🏆</div><h2>التوجيهي</h2><div class="btn">دخول</div>
        </a>
    </div>

    <div class="teacher-badge">
        أ. أسامة هديب
    </div>
</body>
</html>
