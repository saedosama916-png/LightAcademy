<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Academy للفيزياء | أ. أسامة هديب</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f0f12;
            background-image: radial-gradient(circle at top center, #1d1d24 0%, #0f0f12 75%);
            margin: 0;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 150px,
                rgba(253, 197, 0, 0.04) 150px,
                rgba(253, 197, 0, 0.04) 153px
            );
            z-index: -1;
            pointer-events: none;
        }
        header {
            width: 100%;
            text-align: center;
            padding: 68px 20px 25px 20px;
        }
        h1 { margin: 0; font-size: 3.4em; font-weight: 900; }
        .title-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .light-text {
            color: #fdc500;
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 1.75em;
            font-weight: normal;
            line-height: 1.1;
            direction: ltr;
        }
        .physics-text {
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.72em;
            margin-top: -12px;
            margin-right: 15px;
        }
        p.subtitle {
            margin: 25px 0 0 0;
            font-size: 1.45em;
            color: #b8b8c2;
            font-weight: 700;
        }
        .container {
            display: flex;
            gap: 28px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            padding: 20px;
            width: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(253, 197, 0, 0.18);
            width: 255px;
            border-radius: 20px;
            padding: 38px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 40px rgba(253, 197, 0, 0.2);
            border-color: #fdc500;
            background: rgba(253, 197, 0, 0.06);
        }
        .icon { font-size: 4.2em; margin-bottom: 18px; }
        .card h2 { color: #fff; margin: 0 0 22px 0; font-size: 1.75em; font-weight: 900; }
        .btn {
            background-color: #fdc500;
            color: #0f0f12;
            padding: 11px 28px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.15em;
            transition: all 0.3s;
            width: 78%;
        }
        .card:hover .btn { background-color: #ffffff; color: #0f0f12; }
        .disabled { opacity: 0.42; cursor: not-allowed; border-color: rgba(255,255,255,0.1); }
        .disabled:hover { transform: none; border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .disabled .btn { background-color: #2c2c34; color: #888; }
        .disabled:hover .btn { background-color: #2c2c34; color: #888; }
        .teacher-badge {
            margin-top: 45px;
            margin-bottom: 35px;
            padding: 12px 42px;
            background: rgba(253, 197, 0, 0.08);
            border: 2px solid #fdc500;
            border-radius: 50px;
            color: #fdc500;
            font-size: 1.45em;
            font-weight: 900;
            transition: all 0.3s;
        }
        .teacher-badge:hover { background: #fdc500; color: #0f0f12; }
    </style>
</head>
<body>
    <div class="bg-lines"></div>
    <header>
        <h1>
            <div class="title-wrapper">
                <span class="light-text">Light Academy</span>
                <span class="physics-text">للفيزياء</span>
            </div>
        </h1>
        <p class="subtitle">طريقك نحو الإبداع</p>
    </header>
    <div class="container">
        <a href="grade9.html" class="card">
            <div class="icon">🏫</div>
            <h2>التاسع</h2>
            <div class="btn">دخول</div>
        </a>
        <a href="grade10.html" class="card">
            <div class="icon">🎓</div>
            <h2>العاشر</h2>
            <div class="btn">دخول</div>
        </a>
        <a href="#" class="card disabled" onclick="event.preventDefault();">
            <div class="icon">🔬</div>
            <h2>الأول ثانوي</h2>
            <div class="btn">قريباً</div>
        </a>
        <a href="tawjihi.html" class="card">
            <div class="icon">🏆</div>
            <h2>التوجيهي</h2>
            <div class="btn">دخول</div>
        </a>
    </div>
    <div class="teacher-badge">أ. أسامة هديب</div>
</body>
</html>
