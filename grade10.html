<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف العاشر | Light Academy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; width: 100%; text-align: center; padding: 30px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 2.5em; }
        .breadcrumb { font-size: 1.1em; color: #ecf0f1; margin-top: 10px; }
        .breadcrumb a { color: #ecf0f1; text-decoration: none; font-weight: bold;}
        .breadcrumb a:hover { text-decoration: underline; color: #f1c40f;}
        .container { display: flex; gap: 30px; margin-top: 50px; flex-wrap: wrap; justify-content: center; max-width: 1200px; padding: 20px; }
        .card { background: white; width: 300px; border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: transform 0.3s; text-decoration: none; color: #333; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-10px); border-bottom: 5px solid #3498db; }
        .icon { font-size: 4em; margin-bottom: 15px; }
        .card h2 { color: #2980b9; margin-bottom: 15px; }
        .btn { background-color: #3498db; color: white; padding: 10px 25px; border-radius: 25px; font-weight: bold; width: 80%; }
        .card:hover .btn { background-color: #2980b9; }
        .disabled { opacity: 0.6; cursor: not-allowed; }
        .disabled:hover { transform: none; border-bottom: none; }
        .disabled .btn { background-color: #95a5a6; }
    </style>
</head>
<body>
    <header>
        <h1>🎓 فيزياء الصف العاشر</h1>
        <div class="breadcrumb"><a href="index.html">Light Academy</a> > الصف العاشر</div>
    </header>
    <div class="container">
        <a href="grade10_sem1.html" class="card">
            <div class="icon">🍂</div>
            <h2>الفصل الدراسي الأول</h2>
            <div class="btn">اختر الفصل</div>
        </a>
        <a href="#" class="card disabled" onclick="event.preventDefault();">
            <div class="icon">🌸</div>
            <h2>الفصل الدراسي الثاني</h2>
            <div class="btn">قريباً</div>
        </a>
    </div>
</body>
</html>
